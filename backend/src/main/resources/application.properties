spring.application.name=backend

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scribeloop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scribeloop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scribeloop}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-change-32chars}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId}] %c{1} - %m%n

server.error.include-message=always

management.endpoints.web.exposure.include=health,info
