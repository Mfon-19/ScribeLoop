databases:
  - name: scribeloop-db
    plan: free

services:
  - type: web
    name: scribeloop-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scribeloop-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_EXPIRATION_SECONDS
        value: "3600"

  - type: web
    name: scribeloop-collab
    runtime: node
    plan: free
    rootDir: collab
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: COLLAB_DATABASE_URL
        fromDatabase:
          name: scribeloop-db
          property: connectionString
      - key: COLLAB_JWT_SECRET
        sync: false
      - key: COLLAB_API_BASE_URL
        sync: false
